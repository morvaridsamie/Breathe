<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090a0f;
            font-family: 'Inter', sans-serif;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, rgba(9, 10, 15, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Breathing Circle Component */
        .circle-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .breath-circle {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(29, 185, 84, 0.25) 0%, rgba(29, 185, 84, 0.05) 100%);
            border: 1px solid rgba(29, 185, 84, 0.4);
            border-radius: 50%;
            position: absolute;
            transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1), border-color 4s ease, background 4s ease;
        }

        /* Animation states */
        .breath-circle.inhale {
            transform: scale(1.35);
            border-color: rgba(29, 185, 84, 0.8);
            background: radial-gradient(circle, rgba(29, 185, 84, 0.4) 0%, rgba(29, 185, 84, 0.1) 100%);
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.2);
        }

        .breath-circle.exhale {
            transform: scale(0.85);
            border-color: rgba(29, 185, 84, 0.2);
            background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, rgba(29, 185, 84, 0.02) 100%);
            box-shadow: none;
        }

        .breath-text {
            position: relative;
            z-index: 3;
            font-size: 15px;
            font-weight: 400;
            color: #e5e7eb;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .counter {
            font-size: 13px;
            color: #6b7280;
            margin-top: 12px;
            font-weight: 400;
        }

        .btn {
            background-color: #ffffff;
            color: #090a0f;
            border: none;
            padding: 14px 32px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .btn:hover {
            background-color: #e5e7eb;
            transform: translateY(-1px);
        }

        /* Reward Section */
        #reward-card {
            display: none;
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .reward-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #1DB954;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .song-title {
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .song-artist {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 24px;
            font-weight: 300;
        }

        .spotify-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #1DB954;
            color: #000000;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .spotify-link:hover {
            background-color: #1ed760;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        let currentBreath = 0;
        const totalBreaths = 3;

        function startBreathing() {
            document.getElementById('start-btn').style.display = 'none';
            currentBreath = 0;
            runBreathingCycle();
        }

        function runBreathingCycle() {
            if (currentBreath < totalBreaths) {
                currentBreath++;
                document.getElementById('breath-count').innerText = `${currentBreath} of ${totalBreaths} Breaths`;
                
                const circle = document.getElementById('circle');
                const status = document.getElementById('breath-status');

                // Inhale (4 Seconds)
                status.innerText = "Inhale";
                circle.className = "breath-circle inhale";

                setTimeout(() => {
                    // Exhale (4 Seconds)
                    status.innerText = "Exhale";
                    circle.className = "breath-circle exhale";

                    setTimeout(() => {
                        runBreathingCycle();
                    }, 4000);

                }, 4000);

            } else {
                // Completed
                document.getElementById('breath-status').innerText = "Good Job";
                document.getElementById('circle').className = "breath-circle";
                document.getElementById('breath-count').innerText = "3 of 3 Breaths Completed";
                
                showReward();
            }
        }

        function showReward() {
            const randomIndex = Math.floor(Math.random() * songDatabase.length);
            const song = songDatabase[randomIndex];

            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-artist').innerText = song.artist;
            document.getElementById('spotify-url').href = song.url;

            document.getElementById('reward-card').style.display = 'block';
            document.getElementById('sub-title').innerText = "You just cleared your mind.";
        }
    </script>
